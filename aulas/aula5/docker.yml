docker-compose.yml
version: '3.8'

services:
  # Nossa API IntelliDoc
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434/v1
    depends_on:
      - ollama

  # O Serviço de IA (Ollama rodando em container)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama # Salva os modelos baixados

volumes:
  ollama_data: